[project]
name = "guildward"
version = "0.2.0"
description = "Open-source Discord child-safety app: kids check servers, people and messages; parents and admins get real signals."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7,<3",
]

[project.scripts]
guildward = "guildward.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guildward"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# Look-alike Unicode is the point here: rules and tests must catch fancy-font evasion.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/guildward/bot/render.py" = ["E501"]  # translation table: one string per line reads better
"src/guildward/intel/behavior.py" = ["E501"]
"src/guildward/intel/audit.py" = ["E501"]
"src/guildward/guard/reports.py" = ["E501"]
"src/guildward/guard/render.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.audioop. is deprecated:DeprecationWarning"]
