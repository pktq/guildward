name: Bug report
description: Something in the bot, Guard, the site or the dashboard does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not use this form; see [SECURITY.md](https://github.com/pktq/guildward/blob/main/SECURITY.md).
        **Never paste real messages from children, user IDs, invite links or other personal data.**
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Kids' app (checks)"
        - "Guard (server admin)"
        - "Dashboard / site"
        - "Local development / CI"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented examples, not real conversations.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Commit or branch, Python and Node versions, OS (only if relevant)
