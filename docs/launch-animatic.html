<title>The Door Animatic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* Layout: one centred film player with burned-in captions, chapter strip beneath. Single night theme on purpose: it's a film. */
:root{
  color-scheme: dark;
  --ink:#0a0d16; --panel:#121827; --line:#262f47; --text:#e9edf5; --muted:#8d96ab;
  --screen:#7cc4ff; --lamp:#f2a65a; --danger:#ff6b6b; --safe:#5fd3a2; --warn:#ffc857;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
header{width:100%;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}

.player{width:min(100%, calc((100svh - 250px) * var(--ar))); min-width:min(100%,300px)}
.stage{position:relative;width:100%;aspect-ratio:var(--arw)/var(--arh);background:#070a12;overflow:hidden;border-radius:10px;
  container-type:size;container-name:stage;cursor:pointer;box-shadow:0 20px 60px #0008}
.scene{position:absolute;inset:0}
.layer{position:absolute;inset:0}

/* captions */
.cap{position:absolute;left:6cqw;right:6cqw;bottom:4.5cqh;display:flex;justify-content:center;pointer-events:none;z-index:20}
.cap span{background:#05070dcc;padding:.6cqmin 1.6cqmin;border-radius:.8cqmin;font-size:3.4cqmin;line-height:1.35;text-align:center;max-width:80cqw;text-wrap:balance}
.cap b{display:block;font-size:2cqmin;letter-spacing:.14em;color:var(--warn);text-transform:uppercase;margin-bottom:.2cqmin}
.cap .N b{color:var(--screen)} .cap .L b{color:var(--safe)}
@container stage (aspect-ratio < 1){ .cap span{font-size:3.9cqmin;max-width:90cqw} .cap b{font-size:2.5cqmin} .cap{bottom:2.5cqh;left:4cqw;right:4cqw} }

.bigplay{position:absolute;inset:0;display:grid;place-items:center;z-index:30;background:#0006;border:0;color:var(--text);cursor:pointer;font:inherit}
.bigplay span{display:flex;align-items:center;gap:1.4cqmin;background:#0b0f1ce6;border:1px solid var(--line);padding:1.6cqmin 3cqmin;border-radius:99px;font-size:3cqmin}
.bigplay span::before{content:"";border-left:2.4cqmin solid var(--text);border-top:1.4cqmin solid transparent;border-bottom:1.4cqmin solid transparent}
.bigplay:focus-visible span{outline:2px solid var(--screen)}

/* controls */
.controls{width:100%;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px}
.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:0}
.btn:hover{border-color:#3b4766} .btn:focus-visible{outline:2px solid var(--screen);outline-offset:2px}
.btn[aria-pressed="true"]{background:#1e2a44;border-color:var(--screen)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:92px}
.scrub{flex:1 1 220px;min-width:0;accent-color:var(--screen)}
.fmt{display:flex;gap:6px}
.chapters{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chapters button{text-align:left;display:flex;flex-direction:column;gap:2px}
.chapters small{color:var(--muted);font-variant-numeric:tabular-nums}
.chapters button.on{border-color:var(--warn)}
.note{color:var(--muted);font-size:14px;max-width:70ch;text-align:center;margin:4px auto 0}

/* shared stage pieces */
.serif{font-family:var(--display)}
.centerline{position:absolute;left:6cqw;right:6cqw;text-align:center}
.hook{top:10cqh;font-family:var(--display);font-size:6.2cqmin;font-weight:600;text-shadow:0 2px 20px #000}
svg text{font-family:var(--body)}

/* S2 */
.s2title{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:600;font-size:11cqmin;letter-spacing:.02em}
.s2sub{position:absolute;left:0;right:0;text-align:center;color:var(--muted);font-size:3.2cqmin}
.diag{position:absolute;left:5cqw;right:5cqw;top:27cqh;height:48cqh}
.diag svg{width:100%;height:100%}
.duo{position:absolute;left:6cqw;right:6cqw;top:24cqh;display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
.kcard{background:#121a2c;border:1px solid var(--line);border-radius:1.4cqmin;padding:2.6cqmin;display:flex;flex-direction:column;gap:1cqmin}
.kcard h3{margin:0;font-family:var(--display);font-size:4.4cqmin;font-weight:600}
.kcard.money h3{color:var(--warn)} .kcard.control h3{color:#c9a7ff}
.kcard p{margin:0;font-size:2.6cqmin;color:#cfd5e2}
@container stage (aspect-ratio < 1){
  .duo{grid-template-columns:1fr;top:20cqh;gap:2cqh} .kcard h3{font-size:6cqmin} .kcard p{font-size:3.8cqmin}
  .diag{top:24cqh;height:40cqh}
}

/* S3 chat */
.rail{position:absolute;top:4cqh;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:1.4cqmin;font-size:2.8cqmin}
.rail .step{padding:.5cqmin 1.8cqmin;border-radius:99px;border:1px solid var(--line);color:var(--muted);transition:all .3s}
.rail .step.on{color:#0a0d16;background:var(--warn);border-color:var(--warn);font-weight:700}
.rail .step.past{color:var(--text)}
.rail .arr{color:#4a5572}
.chatpos{position:absolute;left:50%;top:13cqh;bottom:18cqh;width:46cqw;transform:translateX(-50%)}
.chat{position:absolute;inset:0;background:#171c2b;border:1px solid var(--line);border-radius:1.4cqmin;overflow:hidden;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:1.4cqmin;padding:1.4cqmin 1.8cqmin;background:#1f2538;border-bottom:1px solid var(--line);transition:background .4s,color .4s}
.chead.app2{background:#e8b84a;color:#1a1408}
.chead .av{width:4.6cqmin;height:4.6cqmin;border-radius:50%;background:linear-gradient(135deg,#ffb3c7,#c79bff);flex:none}
.chead b{display:block;font-size:2.6cqmin}
.chead small{display:block;font-size:1.9cqmin;opacity:.7}
.cbody{position:absolute;left:0;right:0;top:8.6cqmin;bottom:0;padding:1.8cqmin;display:flex;flex-direction:column;gap:1.2cqmin}
.bub{max-width:78%;padding:1cqmin 1.6cqmin;border-radius:1.6cqmin;font-size:2.4cqmin;line-height:1.3;opacity:0}
.bub.them{background:#2a3150;align-self:flex-start;border-bottom-left-radius:.4cqmin}
.bub.me{background:#2f7f86;align-self:flex-end;border-bottom-right-radius:.4cqmin}
.bub.blur{filter:blur(.5cqmin)}
.bub.lit{box-shadow:0 0 0 .45cqmin var(--warn)}
.sys{font-size:2cqmin;color:var(--muted);text-align:center;padding:.6cqmin;border:1px dashed var(--line);border-radius:1cqmin}
.sys .acc{color:var(--safe)}
.flycard{position:absolute;width:6cqmin;height:7.6cqmin;background:#f4f6fb;border-radius:.6cqmin;box-shadow:0 0 30px #fff6;opacity:0}
.grid6{position:absolute;left:5cqw;right:5cqw;top:12cqh;bottom:30cqh;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqmin;opacity:0}
.mini{background:#151a28;border:1px solid var(--line);border-radius:1cqmin;padding:1.2cqmin;display:flex;flex-direction:column;gap:.8cqmin;overflow:hidden}
.mini b{font-size:1.9cqmin;color:var(--muted)}
.mini .bub{opacity:1;font-size:1.8cqmin}
.silh{position:absolute;left:50%;bottom:0;width:40cqw;transform:translateX(-50%);opacity:0}
.threat{position:absolute;left:50%;top:14cqh;width:56cqw;transform:translateX(-50%);display:flex;flex-direction:column;gap:1.4cqmin;align-items:flex-start}
.threat .tb{background:#3a1820;border:1px solid var(--danger);color:#ffd9d9;padding:1.2cqmin 1.8cqmin;border-radius:1.6cqmin;font-size:3cqmin;opacity:0}
.timer{align-self:center;font-variant-numeric:tabular-nums;font-size:8cqmin;color:var(--danger);font-weight:700;letter-spacing:.04em;opacity:0;margin-top:1cqmin}
@container stage (aspect-ratio < 1){
  .chatpos{width:84cqw;top:10cqh;bottom:16cqh} .bub{font-size:3.6cqmin} .chead b{font-size:3.8cqmin} .chead small{font-size:2.8cqmin}
  .cbody{top:11cqmin} .rail{font-size:3.4cqmin;top:3cqh}
  .grid6{grid-template-columns:repeat(2,1fr);top:9cqh;bottom:28cqh} .mini .bub{font-size:2.6cqmin} .mini b{font-size:2.6cqmin}
  .threat{width:84cqw} .threat .tb{font-size:4.2cqmin} .silh{width:80cqw}
}

/* S4 */
.stat{position:absolute;left:6cqw;right:6cqw;top:22cqh;text-align:center;opacity:0}
.stat .num{font-family:var(--display);font-weight:600;font-size:16cqmin;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:3.6cqmin;color:#cfd5e2;max-width:60ch;margin:2cqmin auto 0;text-wrap:balance}
.src{position:absolute;right:3cqw;top:3cqh;font-size:1.8cqmin;color:var(--muted)}
.kid{position:absolute;left:50%;top:14cqh;height:52cqh;transform:translateX(-50%);opacity:0}
.signs{position:absolute;left:8cqw;right:8cqw;top:12cqh;bottom:24cqh;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqmin}
.sign{position:relative;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:3.8cqmin;background:#10162499;border-radius:1.4cqmin;padding:2cqmin;opacity:0}
.sign svg{position:absolute;inset:4% 3%;width:94%;height:92%;overflow:visible}
@container stage (aspect-ratio < 1){ .stat .lbl{font-size:4.6cqmin} .sign{font-size:4.6cqmin} .signs{left:5cqw;right:5cqw} }

/* S5–S7 door */
.split{position:absolute;inset:5cqh 5cqw 22cqh;display:grid;grid-template-columns:40% 1fr;gap:4cqw;align-items:center}
.doorbox{height:100%;min-height:0;display:grid;place-items:center}
.doorbox svg{width:100%;height:100%}
.door .c{stroke:var(--screen);stroke-width:4;stroke-linecap:round}
.door .n circle{fill:#1d2a44;stroke:var(--screen);stroke-width:2}
.door .n.done circle{fill:#123a2e;stroke:var(--safe)}
.door .n text{fill:var(--text);font-size:15px;font-weight:700;text-anchor:middle}
.side{position:relative;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.6cqmin}
.side h2{margin:0;font-size:2.2cqmin;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.gap{display:grid;grid-template-columns:auto 1fr;gap:.4cqmin 1.6cqmin;align-items:start;opacity:.12}
.gap .badge{width:3.8cqmin;height:3.8cqmin;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:2.1cqmin;background:#1d2a44;border:2px solid var(--screen)}
.gap .ttl{font-size:2.9cqmin;font-weight:700;line-height:1.25}
.gap .sub{grid-column:2;font-size:2.1cqmin;color:#b9c1d3;line-height:1.3}
.fixes{position:relative;flex:1;min-height:0}
.fix{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1.4cqmin;opacity:0}
.fix .gl{font-size:2.4cqmin;color:var(--muted)}
.fix .gl s{color:#b9c1d3;text-decoration-color:var(--safe);text-decoration-thickness:2px}
.side .head{display:flex;justify-content:space-between;align-items:center;gap:2cqmin;flex-wrap:wrap}
.fix h3{margin:0;font-family:var(--display);font-size:4.8cqmin;font-weight:600;color:var(--safe)}
.dots{display:flex;gap:1cqmin;align-items:center;font-size:2cqmin;color:var(--muted)}
.dots i{width:2.2cqmin;height:2.2cqmin;border-radius:50%;background:#1d2a44;border:2px solid var(--screen);display:inline-block}
.dots i.done{background:var(--safe);border-color:var(--safe)}
.mock{background:#151b2b;border:1px solid var(--line);border-radius:1.2cqmin;padding:1.8cqmin;font-size:2.2cqmin;display:flex;flex-direction:column;gap:1.1cqmin}
.mock .row{display:flex;justify-content:space-between;align-items:center;gap:2cqmin}
.tog{width:5.2cqmin;height:2.8cqmin;border-radius:99px;background:#3a4258;position:relative;flex:none;transition:background .3s}
.tog::after{content:"";position:absolute;top:.35cqmin;left:.35cqmin;width:2.1cqmin;height:2.1cqmin;border-radius:50%;background:#e9edf5;transition:transform .3s}
.tog.on{background:var(--safe)} .tog.on::after{transform:translateX(2.4cqmin)}
.menu{display:flex;flex-direction:column;background:#0f1422;border:1px solid var(--line);border-radius:.8cqmin;padding:.6cqmin;width:max-content;max-width:100%}
.menu span{padding:.5cqmin 1.2cqmin;border-radius:.5cqmin;color:#b9c1d3}
.menu span.hl{background:#2a3a5c;color:var(--text)}
.embed{border-left:.7cqmin solid var(--danger);background:#1c2335;padding:1.4cqmin 1.6cqmin;border-radius:.8cqmin;display:flex;flex-direction:column;gap:.5cqmin;opacity:0}
.embed.y{border-left-color:var(--warn)}
.embed b{font-size:2.5cqmin}
.embed .muted{color:var(--muted);font-size:1.9cqmin}
.btns{display:flex;gap:1cqmin;flex-wrap:wrap;margin-top:.6cqmin}
.btns span{border:1px solid #3a4560;border-radius:.6cqmin;padding:.4cqmin 1.2cqmin;font-size:2cqmin}
.cmd{font-family:ui-monospace,Consolas,monospace;background:#0f1422;border-radius:.6cqmin;padding:.8cqmin 1.2cqmin}
.msgline{background:#2a3150;border-radius:1.4cqmin;padding:1cqmin 1.4cqmin;width:max-content;max-width:100%}
.summary{display:flex;flex-direction:column;gap:1cqmin;opacity:0;position:absolute;inset:0;justify-content:center}
.summary div{font-size:2.6cqmin;display:flex;gap:1.2cqmin;align-items:center}
.summary .ok{color:var(--safe);font-weight:700}
.summary .open{color:var(--screen);font-weight:700}
@container stage (aspect-ratio < 1){
  .split{grid-template-columns:1fr;grid-template-rows:40% 1fr;inset:3cqh 6cqw 21cqh;gap:2cqh}
  .gap .sub{display:none} .gap .ttl{font-size:3.6cqmin} .gap .badge{width:4.6cqmin;height:4.6cqmin;font-size:2.6cqmin}
  .side h2{font-size:3cqmin} .fix h3{font-size:5.4cqmin} .fix .gl{font-size:2.8cqmin}
  .mock{font-size:2.8cqmin} .embed b{font-size:3cqmin} .embed .muted{font-size:2.5cqmin} .btns span{font-size:2.5cqmin}
  .dots{font-size:2.8cqmin} .summary div{font-size:3.6cqmin}
}
.doorsolo{position:absolute;inset:4cqh 10cqw 15cqh}
.doorsolo svg{width:100%;height:100%}
.sentence{position:absolute;inset:0;display:grid;place-items:center;padding:0 9cqw;text-align:center;font-family:var(--display);font-size:6.4cqmin;font-weight:600;line-height:1.3;text-wrap:balance;opacity:0;text-shadow:0 2px 30px #000}
.cover{position:absolute;inset:0;background:var(--ink);opacity:0}
.help{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2cqmin;padding:0 10cqw 8cqh;opacity:0}
.help h3{margin:0;font-family:var(--display);font-size:5cqmin;font-weight:600}
.help ol{margin:0;padding-left:3.4cqmin;font-size:3.2cqmin;display:flex;flex-direction:column;gap:.6cqmin}
.help .nf{font-size:3.6cqmin;color:var(--warn);font-weight:700}
.help .res{font-size:2.4cqmin;color:#b9c1d3}
.end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2.4cqmin;text-align:center;opacity:0}
.end .tag{font-family:var(--display);font-size:8cqmin;font-weight:600;text-wrap:balance;padding:0 6cqw}
.end .mark{font-size:3.6cqmin;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--safe)}
.end small{font-size:2.6cqmin;color:var(--muted)}
@container stage (aspect-ratio < 1){ .help ol{font-size:4.2cqmin} .help h3{font-size:6.4cqmin} .help .res{font-size:3.2cqmin} .help .nf{font-size:4.6cqmin} .sentence{font-size:8cqmin} }

@media (prefers-reduced-motion: reduce){ .rail .step,.tog,.tog::after,.chead{transition:none} }
</style>

<div class="wrap">
  <header>
    <h1>The Door · animatic</h1>
    <p>Guildward launch film, timing and story preview. No audio: the captions carry the voiceover.</p>
  </header>

  <div class="player" id="player">
    <div class="stage" id="stage" aria-label="Animated preview of the launch film">
      <div class="scene" id="scene"></div>
      <div class="cap" id="cap" aria-live="off"></div>
      <button class="bigplay" id="bigplay" type="button"><span>Play film</span></button>
    </div>
    <div class="controls">
      <button class="btn" id="play" type="button">Play</button>
      <button class="btn" id="restart" type="button">Restart</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <input class="scrub" id="scrub" type="range" min="0" step="0.1" value="0" aria-label="Position in film">
      <div class="fmt" role="group" aria-label="Video format">
        <button class="btn" type="button" data-ar="16:9" aria-pressed="true">16:9</button>
        <button class="btn" type="button" data-ar="4:5" aria-pressed="false">4:5 LinkedIn</button>
        <button class="btn" type="button" data-ar="9:16" aria-pressed="false">9:16</button>
      </div>
    </div>
  </div>

  <nav class="chapters" id="chapters" aria-label="Scenes"></nav>
  <p class="note">Space plays and pauses. Arrow keys skip 5 seconds. Shapes, timing and captions are placeholders for the animator; the final film will be properly illustrated and voiced.</p>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const P = (t, a, b) => ease(clamp((t - a) / (b - a)));
// fade in over a..b, out over c..d
const win = (t, a, b, c, d) => d === undefined ? P(t, a, b) : Math.min(P(t, a, b), 1 - P(t, c, d));
function show(el, o, dy = 0, s = 1) { el.style.opacity = o; el.style.translate = `0 ${dy}cqh`; el.style.scale = s; }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ---------- door, shared by scenes 5–7 ---------- */
const CRACKS = [
  { x1: 119, y1: 92, x2: 119, y2: 228, nx: 84, ny: 160 },
  { x1: 281, y1: 100, x2: 281, y2: 246, nx: 316, ny: 172 },
  { x1: 152, y1: 59, x2: 256, y2: 59, nx: 204, ny: 30 },
  { x1: 281, y1: 292, x2: 281, y2: 430, nx: 316, ny: 360 },
  { x1: 119, y1: 272, x2: 119, y2: 430, nx: 84, ny: 350 },
];
function doorSVG() {
  return `<svg class="door" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A closed bedroom door">
  <defs>
    <filter id="dglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff" stop-opacity=".6"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="roomg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3352"/><stop offset="1" stop-color="#0d1a2c"/></linearGradient>
    <radialGradient id="warmg" cx=".2" cy="1" r="1.2"><stop offset="0" stop-color="#f2a65a" stop-opacity=".75"/><stop offset="1" stop-color="#f2a65a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="520" fill="#121829"/>
  <rect y="470" width="400" height="50" fill="#1a1610"/>

    [40.6, 44.3, 'N', 'It doesn\'t read private messages, and it isn\'t spyware.'],
    [44.4, 47.9, 'N', 'It\'s a tool your child holds: a warning at the moment it matters, and what to do next.']],
  build(root) {
    root.innerHTML = `<div class="split"><div class="doorbox">${doorSVG()}</div>
      <div class="side"><div class="head"><h2>What Guildward does</h2><div class="dots">${GAPS.map(() => '<i></i>').join('')}<span>gaps closed</span></div></div>
        <div class="fixes">
          ${FIX.map((f, i) => `<div class="fix"><span class="gl">Gap ${i + 1}: <s>${GAPS[i][0]}</s></span><h3>${f.name}</h3>${f.html}</div>`).join('')}
          <div class="summary">${GAPS.map(([a]) => `<div><span class="ok">Closed</span><span>${a}</span></div>`).join('')}
            <div><span class="open">Open</span><span>The gap under the door</span></div></div>
        </div>
      </div></div>`;
    this.r = { cracks: $$('.c', root).slice(0, 5), nums: $$('.n', root), fixes: $$('.fix', root), dots: $$('.dots i', root), sum: $('.summary', root) };
  },
  update(t) {
    const r = this.r;
    FIX.forEach((f, i) => {
      const a = FIX0 + i * FIXLEN, lt = t - a, closed = P(t, a + 1.2, a + 2.4);
      r.cracks[i].setAttribute('opacity', 1 - closed);
      r.nums[i].setAttribute('opacity', 1);
      r.nums[i].classList.toggle('done', closed > .5);
      r.dots[i].classList.toggle('done', closed > .5);
      show(r.fixes[i], win(t, a, a + .5, a + FIXLEN - .4, a + FIXLEN), 0);
      f.anim(r.fixes[i], lt);
    });
    show(r.sum, P(t, 40.4, 41));
  }
};

const S7 = {
  title: 'The last gap', dur: 38,
  caps: [[.4, 4.2, 'N', 'There\'s one gap no app can close.'],
    [10.8, 14.7, 'N', 'If your child does tell you, how you react is everything.'],
    [14.8, 18.4, 'N', 'No shame. No punishment. As long as they\'re safe, nothing is ruined.'],
    [20.6, 23.9, 'L', 'Mom? Can I show you something?']],
  build(root) {
    root.innerHTML = `<div class="doorsolo">${doorSVG()}</div>
      <div class="sentence">“Whatever happens online, you can tell me. You won't be in trouble.”</div>
      <div class="help tell"><h3>If your child tells you</h3>
        <ol><li>Stay calm. Thank them for telling you.</li><li>Don't ask why they sent it.</li><li>Don't take their phone away as punishment.</li><li>Say: “We'll fix this together.”</li><li>Then report it, together.</li></ol>
        <div class="nf">They're safe. That's what matters.</div></div>
      <div class="cover"></div>
      <div class="help kidhelp"><h3>If this is happening to you</h3>
        <ol><li>Don't pay. Don't reply.</li><li>Save the messages.</li><li>Block them.</li><li>Tell an adult you trust.</li></ol>
        <div class="nf">It is not your fault.</div>
        <div class="res">Remove images: takeitdown.ncmec.org · Sweden: Bris 116 111 · US: report.cybertip.org</div></div>
      <div class="end"><div class="tag">Be the one they tell.</div><div class="mark">Guildward</div><small>Starting on Discord</small></div>`;
    this.r = { svg: $('svg', root), door: $('.doorsolo', root), c6: $('.c6', root), spill: $('.spill', root), warm: $('.warm', root), sent: $('.sentence', root),
      cover: $('.cover', root), tell: $('.tell', root), help: $('.kidhelp', root), end: $('.end', root) };
  },
  update(t) {
    const r = this.r, pulse = .7 + .3 * Math.sin(t * 2.4);
    r.c6.setAttribute('opacity', pulse); r.spill.setAttribute('opacity', pulse);
    r.door.style.opacity = 1 - .85 * win(t, 4.4, 5, 18.4, 19);
    show(r.sent, win(t, 4.6, 5.4, 9.8, 10.4));
    show(r.tell, win(t, 10.6, 11.3, 17.9, 18.5));
    openDoor(r.svg, 1 - .88 * P(t, 19, 20.8));
    r.warm.setAttribute('opacity', P(t, 19.4, 21.4));
    r.cover.style.opacity = P(t, 24, 24.8);
    show(r.help, win(t, 24.6, 25.4, 31.2, 31.8));
    show(r.end, P(t, 32, 33), 0, .97 + .03 * P(t, 32, 38));
  }
};

const SCENES = [S1, S2, S3, S4, S5, S6, S7];
const STARTS = []; let TOTAL = 0;
SCENES.forEach(s => { STARTS.push(TOTAL); TOTAL += s.dur; });
const WHO = { M: 'Mom', N: 'Narrator', L: 'Leo' };

/* ---------- player ---------- */
const sceneEl = $('#scene'), capEl = $('#cap'), scrub = $('#scrub'), playBtn = $('#play'), timeEl = $('#time'), bigplay = $('#bigplay');
scrub.max = TOTAL;
let t = 1.2, playing = false, cur = -1, lastNow = 0, lastCap = '';
const chaps = $('#chapters');
SCENES.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
  b.innerHTML = `<span>${i + 1}. ${s.title}</span><small>${fmt(STARTS[i])}</small>`;
  b.onclick = () => { seek(STARTS[i] + .01); };
  chaps.append(b);
});
const chapBtns = $$('#chapters button');

function sceneAt(x) { let i = SCENES.length - 1; while (i > 0 && x < STARTS[i]) i--; return i; }
function render() {
  const i = sceneAt(t);
  if (i !== cur) { sceneEl.replaceChildren(); SCENES[i].build(sceneEl); cur = i; chapBtns.forEach((b, j) => b.classList.toggle('on', j === i)); }
  const lt = t - STARTS[i];
  SCENES[i].update(lt);
  const c = SCENES[i].caps.find(([a, b]) => lt >= a && lt < b);
  const key = c ? c[3] : '';
  if (key !== lastCap) { capEl.innerHTML = c ? `<span class="${c[2]}"><b>${WHO[c[2]]}</b>${c[3]}</span>` : ''; lastCap = key; }
  scrub.value = t; timeEl.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
}
function setPlaying(p) {
  playing = p; if (p && t >= TOTAL - .05) t = 0;
  playBtn.textContent = p ? 'Pause' : 'Play'; bigplay.hidden = true;
}
function seek(x) { t = clamp(x, 0, TOTAL); bigplay.hidden = true; render(); }
function frame(now) {
  if (playing) { t += Math.min(.1, (now - lastNow) / 1000); if (t >= TOTAL) { t = TOTAL; setPlaying(false); } render(); }
  lastNow = now; requestAnimationFrame(frame);
}
playBtn.onclick = () => setPlaying(!playing);
bigplay.onclick = e => { e.stopPropagation(); setPlaying(true); };
$('#stage').addEventListener('click', () => setPlaying(!playing));
$('#restart').onclick = () => { seek(0); setPlaying(true); };
scrub.addEventListener('input', () => seek(+scrub.value));
document.addEventListener('keydown', e => {
  if (e.target.closest('input,button') && e.code === 'Space') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  if (e.code === 'ArrowRight') seek(t + 5);
  if (e.code === 'ArrowLeft') seek(t - 5);
});
const AR = { '16:9': [16, 9], '4:5': [4, 5], '9:16': [9, 16] };
function setAR(k) {
  const [w, h] = AR[k], p = $('#player');
  p.style.setProperty('--ar', w / h); p.style.setProperty('--arw', w); p.style.setProperty('--arh', h);
  $$('.fmt .btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.ar === k));
  try { localStorage.setItem('door-ar', k); } catch (e) {}
}
$$('.fmt .btn').forEach(b => b.onclick = () => setAR(b.dataset.ar));
let saved = '16:9'; try { saved = localStorage.getItem('door-ar') || '16:9'; } catch (e) {}
setAR(AR[saved] ? saved : '16:9');
window.seek = seek; // handy for reviewing a frame from the console
render(); requestAnimationFrame(n => { lastNow = n; frame(n); });
</script>
